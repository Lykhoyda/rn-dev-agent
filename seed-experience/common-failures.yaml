failure_families:
  - id: FF_STALE_CDP
    name: Stale CDP target
    symptoms:
      - cdp_status timeout
      - WebSocket close 1006
      - target not found after reload
    recovery:
      - call cdp_status (auto-reconnects via withConnection)
      - if still disconnected, check Metro is running
      - last resort: cdp_reload(full=true)
    notes: cdp_status already handles reconnection — try it before reload

  - id: FF_REDBOX
    name: RedBox/LogBox error overlay
    symptoms:
      - hasRedBox=true in cdp_status
      - error overlay in component tree
    recovery:
      - read cdp_error_log for stack trace
      - fix the source code error
      - cdp_reload if fast-refresh stale
    notes: Check if error is from the current edit or pre-existing

  - id: FF_FAST_REFRESH_STALE
    name: Fast refresh did not pick up changes
    symptoms:
      - code changed but UI unchanged
      - old exports still used after save
      - RedBox referencing old module paths
    recovery:
      - cdp_reload(full=true) BEFORE rewriting code
    notes: Saves ~3 fix-retry loops. Try reload first, edit second.

  - id: FF_METRO_CACHE
    name: Metro serving stale bundle
    symptoms:
      - config change not reflected (babel, metro, tailwind)
      - old code running after editing config files
    recovery:
      - restart Metro with --reset-cache
      - cdp_reload(full=true)
    notes: Metro does not invalidate cache on config changes

  - id: FF_BINARY_MISMATCH
    name: Native binary / JS bundle version mismatch
    symptoms:
      - TurboModuleRegistry.getEnforcing module not found
      - Invariant native module cannot be null
      - native module mismatch errors
    recovery:
      - rebuild with npx expo run:ios or npx expo run:android
    notes: Do NOT retry or clear app data — only a rebuild fixes this

  - id: FF_EXPO_DIALOG
    name: Expo Go / Dev Client system dialog blocking
    symptoms:
      - device_find cannot find expected element
      - screenshot shows system confirmation dialog
      - open-in-app system alert visible
    recovery:
      - use cdp_evaluate with __NAV_REF__ instead of deep links
      - for Dev Client, use agent-device tools (not blocked like Expo Go)
    notes: Deep links trigger native dialogs in Expo Go (B56). Expo Go bundle IDs are blocked by agent-device.

  - id: FF_DEV_CLIENT_PICKER
    name: Expo Dev Client server picker blocking
    symptoms:
      - cdp_status fails to connect
      - no Hermes target found
      - screenshot shows "DEVELOPMENT SERVERS"
      - cdp_navigation_state returns empty or DevClientLauncher
    recovery:
      - run the check-env foreground-surface preflight on the authority-bound device
      - use cdp_dismiss_dev_client_picker when the preflight classifies this picker
      - wait 15-25s for rebundle after dismissal
    notes: >
      The Dev Client picker appears after deep links, app restarts, permission
      changes, or clearState. It is a native screen (not React), so classification
      requires a fresh native snapshot from the attaching session. Never use a
      manual coordinate tap as fallback.

  - id: FF_KEYBOARD_OVERLAY
    name: Keyboard obscuring target element
    symptoms:
      - device_press fails on element behind keyboard
      - element exists in tree but tap has no effect
    recovery:
      - device_back to dismiss keyboard first
      - scroll to element before tapping
    notes: Always dismiss keyboard before interacting with elements below it

  - id: FF_MAESTRO_GRPC_ANDROID
    name: Maestro gRPC UNAVAILABLE on Android
    symptoms:
      - "UNAVAILABLE: io exception"
      - maestro.drivers.AndroidDriver gRPC error
      - run_flow fails on Android but iOS works
    recovery:
      - replay Android YAML through maestro_run (exact pin-cache maestro-runner)
      - "always pass platform=android to maestro_run"
      - never classic Maestro gRPC, maestro-cli, PATH maestro-runner, or ~/.maestro-runner
    notes: >
      Classic Maestro Android driver uses gRPC over port 7001 to an Instrumentation
      APK on the device. This is fragile and fails frequently (GH #7, upstream #998).
      pin-cache maestro-runner uses direct HTTP to UIAutomator2 — no gRPC, no driver APK needed.

  - id: FF_ANDROID_TEXT_INPUT_CRASH
    name: Android text input crashes or backgrounds app
    symptoms:
      - app disappears after mobile_type_keys
      - home screen shown after text input
      - ANR during long text input on Android
    recovery:
      - use device_fill (one exact owner with stable exact read-back)
      - avoid special characters in direct adb input
      - split input into shorter chunks (< 30 chars)
    notes: >
      Android dispatches text as individual key events. Special characters (+, @, #)
      and long strings (> 30 chars) can overwhelm the input method causing ANR or
      crash. device_fill avoids ambient adb typing by using one exact owner and
      stable exact read-back.

  - id: FF_AUTH_GATE
    name: App on auth screen — not logged in
    symptoms:
      - navigation state shows Login or Welcome or Register or Auth route
      - feature screen not reachable — app stuck on auth
      - "empty nav state is NOT auth — check FF_DEV_CLIENT_PICKER first"
    recovery:
      - scan .rn-agent/actions/ for a compatible owned learned login action
      - replay the learned login action through cdp_run_action on the authority-bound device
      - verify cdp_navigation_state shows a main app screen after replay
      - if no compatible owned login action exists, stop and report; do not substitute manual login, maestro-cli, or an unowned UI flow
      - use cdp_auto_login only when the user explicitly authorizes legacy per-call recovery; never treat it as durable authority or PR proof
    notes: >
      On fresh/erased devices or after clearState, the app starts logged out.
      Manual coordinate-based login is unreliable (keyboard covers buttons).
      Owned learned-action replay through the exact pin-cache engine handles this in seconds. See GH #10.

  - id: FF_PERMISSION_ALREADY_GRANTED
    name: Permission already granted — flow skips prompt
    symptoms:
      - permission-gated flow completes instantly
      - prompt screen not shown — app navigates past it
      - recording captures no useful content
    recovery:
      - query permission state with device_permission(action=query)
      - revoke the permission before starting the flow
      - restart the app if needed after revoke
      - on iOS, use device_permission(action=reset) since query is not supported
    notes: >
      On non-fresh devices, permissions from previous sessions persist.
      Always query (Android) or reset (iOS) before testing opt-in flows.
      See GH #11.

  - id: FF_DEBUGGER_PAUSED
    name: Debugger paused — JS execution halted
    symptoms:
      - isPaused=true in cdp_status
      - all CDP evaluate calls timeout
    recovery:
      - cdp_reload(full=true) to resume
    notes: Caused by breakpoints or Chrome DevTools connection
