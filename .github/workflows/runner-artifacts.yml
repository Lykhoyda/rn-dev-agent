name: Runner artifacts

# GH #382 (Story 01): publish prebuilt runner artifacts so the first
# device_snapshot action=open never pays the multi-minute cold build.
#
# The gate is STATE-based, not event-based, and publication state has TWO
# halves that are checked independently (scripts/runner-manifest-publication.mts):
#   1. the GitHub Release for the CURRENT plugin.json version carries both
#      runner zips, whose server-reported SHA-256 still matches the trust root,
#      and
#   2. the in-repository runner-manifest.json — the client's offline SHA-256
#      trust root (packages/rn-dev-agent-core/src/runners/runner-artifacts.ts) —
#      matches the manifest published for that same version.
# Keying only on (1) is what let the manifest rot: the manifest asset uploads
# BEFORE the repository update, so a failed update left the release looking
# complete and every later run reported success while runner-manifest.json
# stayed pinned to v0.75.2 through v0.76.7. Checking (2) makes the sweep
# genuinely self-healing: a manifest that never landed is re-detected and
# re-delivered on the next run.
# A release serving zips that no longer match the trust root, with nothing in the
# run rebuilding them, STOPS publication rather than re-hashing what is served:
# adopting those bytes would turn the client's rejection of a substituted archive
# into a routine-looking PR that blesses it. Recovery is force_version, which
# rebuilds both zips from source.
#
# The trust root reaches main through the SAME protected-branch path releases
# use — a branch, a pull request, required checks, a gated merge. It is never
# pushed to main directly and never carries [skip ci]: main requires the
# "Build & Test" status check, and a commit that skips CI can never produce it.
#
# Reruns are idempotent by construction: release uploads use --clobber, the
# manifest branch name is derived from the version alone, an already-open PR for
# that branch is reused rather than duplicated, and a manifest PR left over from
# an earlier version is closed so two of them can never land in either order.
#
# Every job checks out main and publishes only the CURRENT plugin.json version.
# force_version re-publishes that version (skipping the missing-assets check); it
# cannot name a historical one, because the runners are built from current source
# and a backfill would both misattribute the binaries and downgrade the trust root.
#
# Until the manifest PR lands for a released version, clients resolve to the
# local build (provenance 'local') — degraded, not broken.
#
# PREREQUISITES (repo settings, cannot be set from this file):
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests". The repository-wide default workflow permission stays
#     read-only; every job here escalates explicitly via its own `permissions:`
#     block, exactly as release.yml does.
#   - Settings > General > "Allow auto-merge".
#   - A maintainer must approve the manifest PR's queued CI run ("Approve and
#     run"): a workflow-opened PR authenticated with GITHUB_TOKEN parks its
#     pull_request run at action_required, so "Build & Test" does not register
#     on its own. Auto-merge lands the PR as soon as that check goes green.

on:
  push:
    branches: [main]
  schedule:
    # Sweep for releases the push trigger can't see (GITHUB_TOKEN bot merges,
    # B258), for partially-failed builds, and for a manifest PR that has not
    # landed yet. Off-hour minute to dodge load.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: Re-publish artifacts for the CURRENT plugin version, skipping the missing-assets check
        required: false
        default: ''

# One repository-wide group: publication targets a single release and a single
# manifest branch, so runs from different refs must never overlap.
concurrency: runner-artifacts

# Minimal, explicit permissions (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: write

jobs:
  detect:
    name: Detect missing runner artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
      branch: ${{ steps.v.outputs.branch }}
    steps:
      # Always main: workflow_dispatch can be started from any ref, and a manifest
      # branch cut from a feature branch would carry unrelated commits into an
      # auto-merging PR.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: main
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — SHA pin
        with:
          node-version: 22
      - id: v
        name: Decide what this run must build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          # Publication always targets the current plugin version; force_version
          # only skips the missing-assets check, and the decision script rejects
          # it outright if it names anything else.
          CUR=$(jq -r '.version' packages/claude-plugin/plugin.json)
          # Names alone would make the published manifest asset a proxy for the
          # zips: a runner zip re-uploaded with --clobber by a build job whose
          # sibling failed leaves both zips present and both manifests equal
          # while the release serves bytes the trust root cannot verify. The
          # release API reports each asset's own SHA-256 and size, so that drift
          # is detected here without downloading anything.
          if ! gh release view "v$CUR" --json assets \
               --jq '[.assets[] | {name, digest, size}]' > release-assets.json 2> release-view.err; then
            # A failed listing must never read as "the release carries no zips":
            # that rebuilds binaries the release already serves, and neither
            # Xcode nor Gradle is byte-reproducible, so the replacements would
            # drift from the trust root and send every install to a local build.
            # Only a release GitHub itself reports as absent counts as
            # unpublished, and that verdict comes from the API's own 404 status
            # rather than from a CLI message.
            gh api "repos/{owner}/{repo}/releases/tags/v$CUR" > release-probe.json 2>/dev/null || :
            if [ "$(jq -r '.status // "found"' release-probe.json 2>/dev/null)" != "404" ]; then
              cat release-view.err >&2
              echo "::error::could not determine what release v$CUR carries — refusing to guess" >&2
              exit 1
            fi
            echo '[]' > release-assets.json
          fi
          rm -f published-manifest.json
          if jq -e 'any(.[]; .name == "runner-manifest.json")' release-assets.json >/dev/null; then
            gh release download "v$CUR" --pattern runner-manifest.json --output published-manifest.json \
              || rm -f published-manifest.json
          fi
          node scripts/runner-manifest-publication.mts \
            --plugin-version "$CUR" \
            --force-version "$FORCE_VERSION" \
            --release-assets release-assets.json \
            --repo-manifest runner-manifest.json \
            --published-manifest published-manifest.json
      - name: Create the release for this version (idempotent)
        if: steps.v.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Prebuilt runner artifacts for v$VERSION (rn-fast-runner iOS, rn-android-runner)."
          fi

  build-ios:
    name: Build rn-fast-runner (iOS)
    needs: detect
    if: needs.detect.outputs.build == 'true'
    # macos-15 ships Xcode 16.x — required since RnFastRunner.xcodeproj moved to
    # project format 77 (Xcode 15.4 on macos-14 refuses to open it). Same runner
    # choice as native-tests.yml and codeql.yml, which build this project green.
    runs-on: macos-15
    steps:
      # Always main: workflow_dispatch can be started from any ref, and a manifest
      # branch cut from a feature branch would carry unrelated commits into an
      # auto-merging PR.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: main
      - name: build-for-testing (no code signing, both arches)
        run: |
          xcodebuild build-for-testing \
            -project packages/rn-fast-runner/RnFastRunner/RnFastRunner.xcodeproj \
            -scheme RnFastRunner \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
      - name: Zip products + xctestrun (preserving Build/Products layout)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          test -n "$(find build/dd/Build/Products -name '*.xctestrun' -print -quit)" \
            || { echo "no .xctestrun produced — unexpected DerivedData layout"; exit 1; }
          (cd build/dd && zip -r "$GITHUB_WORKSPACE/rn-fast-runner-$VERSION-sim.zip" Build/Products)
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: gh release upload "v$VERSION" "rn-fast-runner-$VERSION-sim.zip" --clobber

  build-android:
    name: Build rn-android-runner (Android)
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      # Always main: workflow_dispatch can be started from any ref, and a manifest
      # branch cut from a feature branch would carry unrelated commits into an
      # auto-merging PR.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: main
      # Ubuntu runners ship a JDK (JAVA_HOME set) and the Android SDK
      # ($ANDROID_HOME). If a future AGP needs a newer JDK, add actions/setup-java.
      - name: assembleDebug + assembleDebugAndroidTest
        working-directory: packages/rn-android-runner
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Zip both APKs (flat)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          APP=packages/rn-android-runner/app/build/outputs/apk/debug/app-debug.apk
          TEST=packages/rn-android-runner/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$APP" && test -f "$TEST" || { echo "APK(s) missing after gradle build"; exit 1; }
          zip -j "rn-android-runner-$VERSION.zip" "$APP" "$TEST"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: gh release upload "v$VERSION" "rn-android-runner-$VERSION.zip" --clobber

  publish-manifest:
    name: Publish runner-manifest.json through a protected-branch PR
    needs: [detect, build-ios, build-android]
    # Runs whenever the trust root is stale — including when both builds were
    # skipped because the release already carries its zips, which is exactly the
    # self-heal case for a manifest update that failed on an earlier run.
    if: >-
      ${{ !cancelled()
      && needs.detect.outputs.publish == 'true'
      && contains(fromJSON('["success","skipped"]'), needs.build-ios.result)
      && contains(fromJSON('["success","skipped"]'), needs.build-android.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      BRANCH: ${{ needs.detect.outputs.branch }}
    steps:
      # Always main: workflow_dispatch can be started from any ref, and a manifest
      # branch cut from a feature branch would carry unrelated commits into an
      # auto-merging PR.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: main
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — SHA pin
        with:
          node-version: 22
      - name: Download both runner zips from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$VERSION" \
            --pattern "rn-fast-runner-$VERSION-sim.zip" \
            --pattern "rn-android-runner-$VERSION.zip" \
            --clobber
      - name: Refuse to deliver a trust root the installed plugin cannot use
        run: |
          # Defence in depth behind the same rule in the decision script: the
          # in-repo manifest is only ever allowed to track plugin.json, because a
          # client uses a prebuilt runner only when manifest.version equals the
          # installed plugin version.
          PLUGIN=$(jq -r '.version' packages/claude-plugin/plugin.json)
          if [ "$VERSION" != "$PLUGIN" ]; then
            echo "::error::refusing to publish a v$VERSION trust root while plugin.json is v$PLUGIN" >&2
            exit 1
          fi
      - id: branch
        name: Reuse or recreate the version-keyed manifest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One deterministic branch per version, so a rerun updates the same
          # branch (and reuses its PR) instead of fanning out duplicates. This is
          # the ONLY place origin is asked whether that branch exists, and only
          # exit 2 ("no matching ref") counts as absent: a transport failure must
          # never be readable as "nothing to deliver".
          rc=0
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null || rc=$?
          case "$rc" in
            0) existed=true ;;
            2) existed=false ;;
            *)
              echo "::error::could not ask origin whether $BRANCH exists (git ls-remote exit $rc)" >&2
              exit 1
              ;;
          esac
          MAIN=$(git rev-parse HEAD)
          # The branch is workflow-owned. Its head is kept — and with it the
          # maintainer's "Approve and run", which is bound to that exact SHA —
          # while what the PR would DELIVER is still nothing but the trust root:
          # the comparison against the merge base must name no other path. That is
          # the invariant that matters, and it does not depend on how many commits
          # this workflow has already made on the branch, nor on main advancing
          # underneath it.
          #
          # Anything else — a commit someone else pushed onto this unprotected
          # branch — must not ride into the auto-merging PR, the same hazard
          # `ref: main` closes above. Such a branch is DISCARDED and cut again
          # from current main rather than corrected in place: the comparison is
          # against the merge base, which a correcting commit cannot move, so
          # patching the tree would leave every later run reporting main's own
          # files as foreign and rewriting the PR head on every merge to main.
          # Deleting the branch also closes its PR, so the replacement starts
          # from a clean base. It is a workflow-owned branch, never main.
          if [ "$existed" = true ]; then
            if ! gh api "repos/{owner}/{repo}/compare/main...$BRANCH" > compare.json; then
              echo "::error::could not compare $BRANCH against main" >&2
              exit 1
            fi
            FOREIGN=$(jq -r --argjson allow '["runner-manifest.json","packages/codex-plugin/runner-manifest.json","packages/claude-plugin/runner-manifest.json"]' \
              '[.files[].filename] - $allow | join(" ")' compare.json)
          fi
          if [ "$existed" = true ] && [ -z "$FOREIGN" ]; then
            echo "reusing $BRANCH: it delivers the trust root and nothing else"
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            if [ "$existed" = true ]; then
              echo "::warning::discarding $BRANCH and cutting it again from main (unexpected paths: $FOREIGN)"
              git push origin --delete "$BRANCH"
              existed=false
            fi
            git checkout -B "$BRANCH" "$MAIN"
          fi
          echo "existed=$existed" >> "$GITHUB_OUTPUT"
      - name: Generate the manifest (sha256 + bytes)
        run: |
          node scripts/build-runner-manifest.mts \
            --version "$VERSION" \
            --ios "rn-fast-runner-$VERSION-sim.zip" \
            --android "rn-android-runner-$VERSION.zip" \
            --out runner-manifest.json
          cp runner-manifest.json packages/codex-plugin/runner-manifest.json
          cp runner-manifest.json packages/claude-plugin/runner-manifest.json
          cat runner-manifest.json
      - name: Attach the manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VERSION" runner-manifest.json --clobber
      - id: commit
        name: Commit the manifest to the branch
        run: |
          git add runner-manifest.json packages/codex-plugin/runner-manifest.json packages/claude-plugin/runner-manifest.json
          # No [skip ci]: main requires the "Build & Test" check, and a commit
          # that skips CI can never produce it.
          if git diff --cached --quiet; then
            echo "manifest already current on $BRANCH — nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): runner-manifest for v$VERSION"
            git push origin "$BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or reuse the manifest PR and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_EXISTED: ${{ steps.branch.outputs.existed }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          # The runner's default shell is `bash -e`, which does NOT set pipefail:
          # without this the superseded-PR sweep below would take the exit status
          # of its trailing `jq` alone and silently close nothing when the listing
          # failed, leaving an armed PR from an earlier version free to land after
          # this one. The sweep is fatal by design, so it must fail as a pipeline.
          set -o pipefail
          # Whether there is anything to deliver comes from the two steps that
          # know it authoritatively; origin is never re-asked, because a failed
          # query would otherwise read as "no branch" and finish this job green
          # with the trust root pushed but undelivered.
          case "$BRANCH_EXISTED:$PUSHED" in
            true:true | true:false | false:true | false:false) ;;
            *)
              echo "::error::manifest branch state was not reported (existed='$BRANCH_EXISTED' pushed='$PUSHED')" >&2
              exit 1
              ;;
          esac
          # A manifest PR left open from an earlier version would race this one:
          # it may already have auto-merge armed and land AFTER it, restoring a
          # stale trust root. Exactly one may be open, so closing them is fatal,
          # not best-effort, and it happens before this PR is armed. It also
          # happens before the "nothing of our own to deliver" return below: a
          # superseded PR is armed independently of whether THIS run has a commit
          # to make, so retiring it may not be conditional on that. Every open PR
          # is paged through rather than capped at a page size, so the invariant
          # cannot degrade silently once the repository carries many open PRs. The
          # branch comparison is done in shell, never in --jq, so a filter that
          # mismatches can never close the PR we just opened. Head-ref names on
          # fork PRs are chosen by the contributor and need no repository
          # permission, so the sweep only ever considers same-repository branches
          # whose suffix is a release version — otherwise anyone could name a fork
          # branch `chore/runner-manifest-vX`, have this job close their PR, and
          # (because that close is fatal) block trust-root delivery outright.
          STALE=$(gh api --paginate 'repos/{owner}/{repo}/pulls?state=open&per_page=100' --jq '.[]' \
            | jq -r --arg repo "$GH_REPO" '
                select(.head.repo.full_name == $repo)
                | select(.head.ref | test("^chore/runner-manifest-v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))
                | "\(.number) \(.head.ref)"')
          while read -r stale ref; do
            { [ -n "$stale" ] && [ "$ref" != "$BRANCH" ]; } || continue
            echo "closing superseded manifest PR #$stale ($ref)"
            gh pr close "$stale" --comment "Superseded by the runner-manifest PR for v$VERSION."
            git push origin --delete "$ref" || echo "::warning::could not delete $ref"
          done <<< "$STALE"
          if [ "$BRANCH_EXISTED:$PUSHED" = false:false ]; then
            echo "the repository trust root already carries v$VERSION — no PR needed"
            exit 0
          fi
          PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "chore(release): runner-manifest for v$VERSION" \
              --body "Refreshes the in-repository runner trust root (\`runner-manifest.json\` and its two host-plugin copies) to the SHA-256 digests published on release v$VERSION. Generated by .github/workflows/runner-artifacts.yml; merges automatically once \"Build & Test\" is approved and green.")
            PR=${PR_URL##*/}
          fi
          case "$PR" in
            '' | *[!0-9]*)
              echo "::error::could not determine the manifest PR number for v$VERSION (gh pr create said: ${PR_URL:-<no output>})" >&2
              exit 1
              ;;
          esac
          # Auto-merge respects branch protection: the PR lands only after the
          # required check passes. Failure to ARM it is an operator-visible
          # misconfiguration, so it fails the job rather than leaving the trust
          # root silently stale.
          if ! out=$(gh pr merge --squash --auto "$PR" 2>&1); then
            echo "$out" >&2
            echo "::error::could not arm auto-merge on PR #$PR — v$VERSION stays undelivered until it lands" >&2
            exit 1
          fi
          echo "$out"
          echo "::warning::runner-manifest v$VERSION is delivered by PR #$PR; approve its queued CI run so \"Build & Test\" can register and auto-merge can land it"
