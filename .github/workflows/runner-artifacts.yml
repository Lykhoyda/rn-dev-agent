name: Runner artifacts

# Native runner producer for the release trust-root transaction, plus the
# delivery sweep.
#
# PRODUCER (workflow_call from release.yml): builds the two runner zips at the
# supplied, already verified candidate SHA and hands them back as retained run
# artifacts together with the digest and length the producer itself measured.
# The caller (trusted release.yml code on main) is the only thing that turns
# those bytes into a release: nothing here uploads to a release, pushes a
# branch, or holds a write credential — checkouts do not persist the token and
# the jobs run with read permissions.
#
# SWEEP (schedule / workflow_dispatch): verifies that main's advertised version
# has its exact bytes public (scripts/check-public-runner-assets.sh) and
# re-attaches a MISSING runner-manifest.json asset from the trust root. It never
# builds: after publication no byte is rebuilt, replaced or re-hashed, and a
# trust root is only ever created on the Version Packages branch before the
# version becomes visible (see release.yml).

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA of the verified release candidate to build
        type: string
        required: true
      version:
        description: Plugin version the candidate advertises (names the zips)
        type: string
        required: true
    outputs:
      ios-sha256:
        value: ${{ jobs.build-ios.outputs.sha256 }}
      ios-bytes:
        value: ${{ jobs.build-ios.outputs.bytes }}
      ios-artifact-id:
        value: ${{ jobs.build-ios.outputs.artifact-id }}
      ios-tree:
        value: ${{ jobs.build-ios.outputs.tree }}
      android-sha256:
        value: ${{ jobs.build-android.outputs.sha256 }}
      android-bytes:
        value: ${{ jobs.build-android.outputs.bytes }}
      android-artifact-id:
        value: ${{ jobs.build-android.outputs.artifact-id }}
      android-tree:
        value: ${{ jobs.build-android.outputs.tree }}
  schedule:
    # Off-hour minute to dodge load.
    - cron: '23 */6 * * *'
  workflow_dispatch:

# Read-only everywhere; the sweep's repair upload declares its own write.
permissions:
  contents: read

jobs:
  build-ios:
    name: Build rn-fast-runner (iOS)
    # Producer calls arrive under the CALLER's event (release.yml runs on push);
    # an empty ref then fails closed in the first step rather than skipping.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    # macos-15 ships Xcode 16.x — required since RnFastRunner.xcodeproj moved to
    # project format 77 (Xcode 15.4 on macos-14 refuses to open it). Same runner
    # choice as native-tests.yml and codeql.yml, which build this project green.
    runs-on: macos-15
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
      bytes: ${{ steps.zip.outputs.bytes }}
      tree: ${{ steps.zip.outputs.tree }}
      artifact-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Refuse anything but a full candidate SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            *[!0-9a-f]* | '') echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1 ;;
          esac
          [ "${#REF}" = 40 ] || { echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: build-for-testing (no code signing, both arches)
        run: |
          xcodebuild build-for-testing \
            -project packages/rn-fast-runner/RnFastRunner/RnFastRunner.xcodeproj \
            -scheme RnFastRunner \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
      - id: zip
        name: Zip products + xctestrun and record the producer identity
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "::error::checkout is not the candidate $REF" >&2; exit 1; }
          test -n "$(find build/dd/Build/Products -name '*.xctestrun' -print -quit)" \
            || { echo "no .xctestrun produced — unexpected DerivedData layout"; exit 1; }
          ZIP="rn-fast-runner-$VERSION-sim.zip"
          (cd build/dd && zip -r "$GITHUB_WORKSPACE/$ZIP" Build/Products)
          {
            echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
            echo "bytes=$(wc -c < "$ZIP" | tr -d ' ')"
            echo "tree=$(git rev-parse HEAD:packages/rn-fast-runner)"
          } >> "$GITHUB_OUTPUT"
      - id: retain
        name: Retain the zip for the release transaction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 — SHA pin
        with:
          name: rn-fast-runner-${{ inputs.version }}-sim
          path: rn-fast-runner-${{ inputs.version }}-sim.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-android:
    name: Build rn-android-runner (Android)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
      bytes: ${{ steps.zip.outputs.bytes }}
      tree: ${{ steps.zip.outputs.tree }}
      artifact-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Refuse anything but a full candidate SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            *[!0-9a-f]* | '') echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1 ;;
          esac
          [ "${#REF}" = 40 ] || { echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Ubuntu runners ship a JDK (JAVA_HOME set) and the Android SDK
      # ($ANDROID_HOME). If a future AGP needs a newer JDK, add actions/setup-java.
      - name: assembleDebug + assembleDebugAndroidTest
        working-directory: packages/rn-android-runner
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - id: zip
        name: Zip both APKs (flat) and record the producer identity
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "::error::checkout is not the candidate $REF" >&2; exit 1; }
          APP=packages/rn-android-runner/app/build/outputs/apk/debug/app-debug.apk
          TEST=packages/rn-android-runner/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$APP" && test -f "$TEST" || { echo "APK(s) missing after gradle build"; exit 1; }
          ZIP="rn-android-runner-$VERSION.zip"
          zip -j "$ZIP" "$APP" "$TEST"
          {
            echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
            echo "bytes=$(wc -c < "$ZIP" | tr -d ' ')"
            echo "tree=$(git rev-parse HEAD:packages/rn-android-runner)"
          } >> "$GITHUB_OUTPUT"
      - id: retain
        name: Retain the zip for the release transaction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 — SHA pin
        with:
          name: rn-android-runner-${{ inputs.version }}
          path: rn-android-runner-${{ inputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sweep:
    name: Verify delivery of the advertised trust root
    # Only main's own copy of this file may hold the repair token: a dispatch
    # from any other ref would run that ref's workflow code with contents: write.
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # The repair upload is the only write; one sweep at a time.
    concurrency: runner-artifacts-sweep
    permissions:
      contents: write
    steps:
      # Always main: workflow_dispatch can be started from any ref, and only the
      # default branch advertises a version.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: main
          persist-credentials: false
      - name: Public runner assets match main's trust root (repair a missing manifest asset only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-public-runner-assets.sh --always --repair
