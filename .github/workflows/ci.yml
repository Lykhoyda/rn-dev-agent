name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# CodeQL actions/missing-workflow-permissions (alerts #27 #28):
# declare minimal permissions at the workflow level. Every job only
# reads source and runs tests — none pushes, comments, or releases.
permissions:
  contents: read

jobs:
  core-tests:
    name: Core, integration & docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — Phase 134.5 SHA pin

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — Phase 134.5 SHA pin
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      # Install from repo root so Yarn resolves the workspace graph once.
      - run: corepack enable
      - run: corepack yarn install --immutable

      - name: Build core and the Observe SPA
        run: corepack yarn build

      # GH#437 (audit P0-B): wire-contract drift must fail a NAMED gate, not
      # hide in the unit blob — tri-file command-enum/protocol sync (#418/#383)
      # plus golden contract tests over payloads captured from live runners.
      - name: Runner wire-contract gate
        run: corepack yarn workspace qaren-core test:contract

      - name: Integration tests
        run: corepack yarn test:integration

      # Runs at repo root (no working-directory) — guards the changeset CI gate.
      - name: Changeset-guard unit test
        run: bash scripts/test/require-changeset.test.sh

      # GH#316/B215: changeset package names must resolve to real workspace packages.
      - name: Changeset-name validator unit test
        run: bash scripts/test/validate-changeset-names.test.sh

      # Release notes for release.yml's publish job render from the plugin CHANGELOG.
      - name: Release-notes renderer unit test
        run: bash scripts/test/release-notes-from-changelog.test.sh

      # Postpublication readiness of the release trust root: a checkout that
      # advertises a plugin version must already have that version's exact
      # runner bytes public (release.yml publishes them before the Version
      # Packages PR may merge; this step is what its merge job waits for).
      # Offline unless the version or root manifest differs from the base.
      - name: Published runner assets match the trust root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/check-public-runner-assets.sh

      - name: Documentation ownership gate
        run: node scripts/check-document-ownership.ts

      - name: Documentation ownership gate unit test
        run: node --test scripts/test/check-document-ownership.test.ts

      - name: QaReN device-gate assertion unit test
        run: node --test scripts/test/assert-qaren-check.test.ts

      - name: Docs app build
        run: corepack yarn workspace qaren-docs build

  unit-tests:
    name: Unit tests (batch ${{ matrix.batch }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — Phase 134.5 SHA pin

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — Phase 134.5 SHA pin
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: corepack enable
      - run: corepack yarn install --immutable

      # GH#439: keep test discovery in the package script; Node's native shard
      # option partitions that one authoritative file set deterministically.
      - name: Run unit-test batch ${{ matrix.batch }}/5 (with coverage report)
        env:
          UNIT_TEST_BATCH: ${{ matrix.batch }}
          UNIT_TEST_BATCHES: 5
          UNIT_TEST_SHARD: ${{ matrix.batch }}/5
        run: |
          TOTAL_TEST_FILES=$(find packages/qaren-core/test/unit -type f \( -name '*.test.js' -o -name '*.test.ts' \) | wc -l | tr -d ' ')
          BASE_BATCH_SIZE=$((TOTAL_TEST_FILES / UNIT_TEST_BATCHES))
          EXTRA_BATCHES=$((TOTAL_TEST_FILES % UNIT_TEST_BATCHES))
          SELECTED_TEST_FILES=$BASE_BATCH_SIZE
          if [ "$UNIT_TEST_BATCH" -le "$EXTRA_BATCHES" ]; then
            SELECTED_TEST_FILES=$((SELECTED_TEST_FILES + 1))
          fi
          echo "Unit-test batch $UNIT_TEST_SHARD: discovered $TOTAL_TEST_FILES files; selected $SELECTED_TEST_FILES files"
          corepack yarn test:coverage

  cargo-test:
    name: cargo-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — Phase 134.5 SHA pin
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (locked)
        run: cargo test --manifest-path packages/qaren-cli/Cargo.toml --locked

  test:
    name: Build & Test
    needs: [core-tests, unit-tests, cargo-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          CARGO_TEST_RESULT: ${{ needs.cargo-test.result }}
        run: |
          echo "Core/integration/docs: $CORE_TESTS_RESULT"
          echo "Five unit-test batches: $UNIT_TESTS_RESULT"
          echo "cargo test: $CARGO_TEST_RESULT"
          test "$CORE_TESTS_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$CARGO_TEST_RESULT" = success

  lint-format:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — Phase 134.5 SHA pin
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — Phase 134.5 SHA pin
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: oxlint
        run: corepack yarn lint
      - name: oxfmt check
        run: corepack yarn format:check
      - name: typescript-only gate
        run: bash scripts/check-typescript-only.sh
      - name: typescript-only gate unit test
        run: bash scripts/test/check-typescript-only.test.sh

  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — Phase 134.5 SHA pin
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — Phase 134.5 SHA pin
        with:
          node-version: 24
      - run: bash scripts/sync-versions.sh
      - name: Version-sync fixer portable-sed guard
        run: bash scripts/test/sync-versions.test.sh

  require-changeset:
    name: Require changeset
    runs-on: ubuntu-latest
    # PR-only: needs a base branch to diff against. Pushes to main are post-merge.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — Phase 134.5 SHA pin
        with:
          fetch-depth: 0
      # base_ref is passed via env (never interpolate ${{ }} directly into run:).
      - name: Require a changeset when shippable src changes
        env:
          BASE_REF_NAME: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF_NAME"
          BASE_REF="origin/$BASE_REF_NAME" bash scripts/require-changeset.sh

      # GH#316/B215: validate that every present changeset names a real workspace
      # package, so a typo fails the PR instead of release.yml's `changeset version`.
      - name: Validate changeset package names
        run: bash scripts/validate-changeset-names.sh
